name: Secret Scan

on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        run: |
          set -euo pipefail
          if rg -n "AIza[0-9A-Za-z_-]{20,}|PEXELS_API_KEY\s*=\s*[A-Za-z0-9_-]{8,}|GOOGLE_API_KEY\s*=\s*[A-Za-z0-9_-]{8,}" -S .; then
            echo "Potential secret found"
            exit 1
          fi
